<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ثبت مقدار سفارش</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b1b1f);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --field: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 32px;
    background: var(--bg); color: var(--text);
    font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.7;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .code {
    display: inline-block; direction: ltr; unicode-bidi: embed;
    padding: 2px 10px; border-radius: 8px;
    background: var(--field); color: var(--hint); font-size: 15px;
  }
  label { display: block; margin: 20px 0 6px; color: var(--hint); font-size: 14px; }
  input, textarea {
    width: 100%; padding: 12px 14px; border: 2px solid transparent;
    border-radius: 12px; background: var(--field); color: var(--text);
    font: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input.bad { border-color: var(--danger); }
  button {
    width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text);
    font: inherit; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  #msg { min-height: 1.7em; margin-top: 12px; font-size: 14px; }
  #msg.err { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>ثبت مقدار سفارش</h1>
  <p>سفارش: <span class="code" id="code">—</span></p>
  <p>کالا: <strong id="item">—</strong></p>

  <label for="value">مقدار سفارش</label>
  <input id="value" inputmode="decimal" autocomplete="off" placeholder="مثلاً 10">

  <label for="note">توضیحات (اختیاری)</label>
  <textarea id="note" rows="3"></textarea>

  <button id="send">ثبت</button>
  <div id="msg" role="status"></div>
</main>

<script>
  // آدرس Webhook در n8n (Production URL) را اینجا بگذارید
  const WEBHOOK_URL = "https://kaveh700.app.n8n.cloud/webhook-test/ddeca4eb-3b50-4913-a81e-bdf6f2438e0c";

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const params = new URLSearchParams(location.search);
  const code = params.get("code") || "";
  const item = params.get("item") || "";
document.getElementById("code").textContent = code || "—";
document.getElementById("item").textContent = item || "—";

  // اگر مقداری از قبل پر شده باشد (?value=...)
  if (params.get("value")) document.getElementById("value").value = params.get("value");

  const btn = document.getElementById("send");
  const msg = document.getElementById("msg");
  const valueEl = document.getElementById("value");

  function say(text, isErr) {
    msg.textContent = text;
    msg.className = isErr ? "err" : "";
  }

  btn.addEventListener("click", async () => {
    const value = valueEl.value.trim();
    valueEl.classList.toggle("bad", !value);
    if (!code) return say("شماره درخواست در لینک نیست. دوباره از داخل ربات باز کنید.", true);
    if (!value) return say("مقدار را وارد کنید.", true);

    btn.disabled = true;
    say("در حال ثبت…");
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code,
          item,
          value,
          note: document.getElementById("note").value.trim(),
          initData: tg.initData          // برای اعتبارسنجی در n8n
        })
      });
      if (!res.ok) throw new Error(res.status);
      say("ثبت شد.");
      tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
      setTimeout(() => tg.close(), 800);
    } catch (e) {
      btn.disabled = false;
      say("ثبت نشد. اتصال را بررسی کنید و دوباره بزنید.", true);
    }
  });
</script>
</body>
</html>
